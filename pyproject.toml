[project]
name = "ew"
version = "0.1.0"
description = "Automatisierte Elliott-Wave-Analyse: Pivot-Lattice, Regel-Engine, Signalgenerierung, Backtest"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "numba>=0.59",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ew*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
